<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World Clock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Global time</p>
          <h1>World Clock</h1>
        </div>
      </header>

      <main class="clock-grid" id="clockGrid" aria-live="polite"></main>

      <section class="controls" aria-label="Timezone controls">
        <label for="timezoneSelect" class="sr-only">Choose a timezone</label>
        <select id="timezoneSelect" aria-label="Timezone picker"></select>
        <button id="addTimezoneBtn" type="button">Add timezone</button>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
